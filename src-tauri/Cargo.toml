[package]
name = "betastart"
version = "0.1.0"
description = "Beta Start — launcher de produtividade e segundo cérebro"
authors = ["Beta Start contributors"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix avoids conflicts between lib and bin names on Windows.
name = "betastart_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
notify = "8"
ignore = "0.4"
dunce = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
arboard = "3"
meval = "0.2"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
wait-timeout = "0.2"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
axum = "0.8"
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "sync"] }
tokio-stream = "0.1"
argon2 = "0.5"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "shellapi", "minwindef", "windef", "libloaderapi", "processthreadsapi", "winbase", "handleapi", "winnt", "wingdi"] }

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
